# Runs the collector every 15 minutes and publishes its output to the `data` branch.
# The data branch is rewritten as a single commit each run, so the repository does not grow.
name: collect
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load previous data
        run: git fetch --depth=1 origin data && git worktree add data FETCH_HEAD || mkdir -p data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one cycle
        run: node server.js --once
      - name: Publish data branch
        run: |
          rm -rf publish && mkdir publish
          cp data/*.json data/*.jsonl publish/ 2>/dev/null || true
          cd publish
          git init -q -b data
          git config user.name "launch-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
